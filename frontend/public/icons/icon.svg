<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2E7D32"/>
      <stop offset="100%" style="stop-color:#1B5E20"/>
    </linearGradient>
    <linearGradient id="cross" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E8F5E9"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  <!-- Inner shadow ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <!-- Health cross -->
  <rect x="216" y="120" width="80" height="272" rx="16" fill="url(#cross)"/>
  <rect x="120" y="216" width="272" height="80" rx="16" fill="url(#cross)"/>
  <!-- Heart accent -->
  <path d="M256 400 C256 400 180 340 180 300 C180 280 196 264 216 264 C230 264 242 272 256 288 C270 272 282 264 296 264 C316 264 332 280 332 300 C332 340 256 400 256 400Z" fill="#E91E63" opacity="0.9"/>
  <!-- M letter -->
  <text x="256" y="235" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="120" font-weight="900" fill="#2E7D32" opacity="0.15">M</text>
</svg>

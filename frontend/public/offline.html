<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — Musawo AI</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0F0F0F;
      color: #F0F0F0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 1.5rem;
    }
    .card { text-align: center; max-width: 380px; }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
    h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.5rem; color: #22C55E; }
    p { font-size: 0.9rem; color: #A3A3A3; line-height: 1.5; margin-bottom: 1.5rem; }
    .emergency { font-size: 0.85rem; color: #EF4444; margin-bottom: 1.5rem; }
    button {
      background: #22C55E;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.75rem 1.5rem;
      font-size: 0.9rem;
      cursor: pointer;
      min-height: 44px;
      touch-action: manipulation;
    }
    button:active { opacity: 0.8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon" aria-hidden="true">&#x1F3E5;</div>
    <h1>You're offline</h1>
    <p>Musawo AI needs an internet connection for health guidance. Your messages will be synced when you reconnect.</p>
    <p class="emergency">For emergencies, call <strong>0800 100 263</strong> (toll-free, 24/7)</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
